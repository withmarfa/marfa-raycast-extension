# Instructions and evals for the AI tools. Kept beside package.json rather than
# inside it, because both grow and a manifest is not where prose belongs.

instructions: |
  Marfa is the person's own store of notes, bookmarks, tasks and whatever else
  their apps keep there. Every item has a type, a name, some text and tags.

  Use search-items when the person describes something they saved. Search
  words, not a query language, and name a type only when they named a kind of
  item. Answer from the rows returned; each already carries its text.

  Use list-items when there are no words to search for: what they saved
  lately, their tasks, what is in the feed or the Trash.

  Use capture-item to save anything. A note is type core.note with one
  property, body, in the person's words and in markdown, its first line naming
  it, since every app titles a note by its first line. For any other kind of
  item, call list-types with that type first to learn its fields and which are
  required, then pass each as text. Add tags only when they asked for them.

  Use list-types to learn what kinds of item the server holds, or what one
  kind takes.

  If a tool fails because the server or the key is not set up, say what the
  error says to change, rather than retrying.

evals:
  - input: '@marfa find the note about the canal walk'
    mocks:
      search-items:
        - id: itm_1
          type: core.note
          kind: Note
          title: Canal walk
          text: 'Sunday, from the lock to the boathouse.'
          tags: ['walks']
          updatedAt: '2026-09-27T10:00:00.000Z'
    expected:
      - callsTool:
          name: search-items
          arguments:
            # `includes`, because a model may search for any of several phrasings
            # and an eval that pins one measures the wording.
            query:
              includes: 'canal'

  - input: '@marfa what tasks did I add most recently?'
    mocks:
      list-items:
        - id: itm_4
          type: core.task
          kind: Task
          title: Renew the passport
          text: ''
          state: active
          tier: library
          tags: []
          updatedAt: '2026-09-27T10:00:00.000Z'
    expected:
      - callsTool:
          name: list-items
          arguments:
            type: core.task

  - input: '@marfa save a note saying the runner pool is fixed, tagged ops'
    mocks:
      capture-item:
        id: itm_2
        type: core.note
        title: The runner pool is fixed
        tier: library
        properties:
          body: The runner pool is fixed
        tags: ['ops']
    expected:
      - callsTool:
          name: capture-item
          arguments:
            type: core.note
            # A note takes one property, its body; the text is the model's wording.
            properties.0.name: body
            properties.0.value:
              includes: 'runner pool'

  - input: '@marfa add a task to renew the passport, high priority'
    mocks:
      list-types:
        type: core.task
        label: Task
        titleField: title
        bodyField: body
        fields:
          - name: title
            kind: string
            required: true
          - name: body
            kind: string
            required: false
          - name: due_at
            kind: datetime
            required: false
          - name: priority
            kind: enum
            required: false
            oneOf: ['low', 'medium', 'high', 'urgent']
      capture-item:
        id: itm_3
        type: core.task
        title: Renew the passport
        tier: library
        properties:
          title: Renew the passport
          priority: high
        tags: []
    expected:
      - callsTool:
          name: list-types
          arguments:
            type: core.task
      - callsTool:
          name: capture-item
          arguments:
            type: core.task
