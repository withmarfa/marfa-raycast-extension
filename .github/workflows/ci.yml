name: CI

# `build` is a required check, so the pull request trigger carries no filter: a
# filtered-out workflow would leave the check pending and block the merge. The
# `changes` job skips the build for a pull request that touches only files
# nothing builds from. A push is required by nothing, so it filters here.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.githooks/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs, and answers whether the pull request touches anything the
  # build reads. Anything uncertain answers true.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-changes.sh

  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    timeout-minutes: 15
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # Ahead of the build because it fails faster and says more when it does.
      - run: npm test

      - run: npm run build

      # Which pull requests skip this job, so a wrong skip cannot ship quietly.
      - run: bash scripts/ci-changes.test.sh
