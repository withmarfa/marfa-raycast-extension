<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Three steps connect Raycast to your own Marfa</title>
  <desc id="d">Install Marfa, make a key for Raycast, then enter the server address and the key in the extension's preferences.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="210" rx="16" fill="#f8f9fb"/>
  <text x="32" y="44" font-size="18" font-weight="600" fill="#111827">Three steps connect Raycast to your own Marfa</text>

  <g>
    <rect x="32" y="72" width="204" height="108" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
    <circle cx="60" cy="100" r="13" fill="#4f46e5"/>
    <text x="60" y="105" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
    <text x="84" y="105" font-size="15" font-weight="600" fill="#111827">Install Marfa</text>
    <text x="48" y="136" font-size="12.5" fill="#4b5563">Run one command and open</text>
    <text x="48" y="154" font-size="12.5" fill="#4b5563">the link to claim your server.</text>
  </g>
  <g>
    <rect x="278" y="72" width="204" height="108" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
    <circle cx="306" cy="100" r="13" fill="#4f46e5"/>
    <text x="306" y="105" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
    <text x="330" y="105" font-size="15" font-weight="600" fill="#111827">Make a key</text>
    <text x="294" y="136" font-size="12.5" fill="#4b5563">Give Raycast a key of its</text>
    <text x="294" y="154" font-size="12.5" fill="#4b5563">own on the API keys page.</text>
  </g>
  <g>
    <rect x="524" y="72" width="204" height="108" rx="12" fill="#fff4ec" stroke="#f26b1d" stroke-width="2"/>
    <circle cx="552" cy="100" r="13" fill="#f26b1d"/>
    <text x="552" y="105" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">3</text>
    <text x="576" y="105" font-size="15" font-weight="600" fill="#111827">Connect Raycast</text>
    <text x="540" y="136" font-size="12.5" fill="#4b5563">Enter the address and the</text>
    <text x="540" y="154" font-size="12.5" fill="#4b5563">key in the preferences.</text>
  </g>
  <g fill="none" stroke="#6b7280" stroke-width="1.25">
    <path d="M236 126H278" marker-end="url(#arrow)"/>
    <path d="M482 126H524" marker-end="url(#arrow)"/>
  </g>
</svg>
