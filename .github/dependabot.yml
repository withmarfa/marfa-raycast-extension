version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-npm:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    # @raycast/api pins these as exact peer deps; drifting splits the React
    # type tree and breaks `tsc --noEmit`. They must track @raycast/api, not
    # Dependabot — bump them only when @raycast/api's peer pins change.
    ignore:
      - dependency-name: "@types/node"
      - dependency-name: "@types/react"
      # @raycast/eslint-config's typescript-eslint refuses TypeScript 7, and ray lint fails with it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
