# Instructions and evals for the AI tools. Kept beside package.json rather than
# inside it, because both grow and a manifest is not where prose belongs.

instructions: |
  Marfa is the person's own data layer. Items have a type, some properties
  defined by that type's schema, and tags.

  Types are not fixed. An instance registers its own and integrations bring
  theirs, so never assume a type exists or what it requires. Call list-types
  before capturing anything you have not already confirmed.

  Prefer list-items for anything about recency ("what did I save today", "my
  tasks") and search-items when the person describes content they are looking
  for.

  Capture writes to their space. Say what you are about to create in the terms
  they used, not in schema terms.

  A tool that refuses because the sign-in was not granted a type is telling you
  something specific: the person has not shared that type with this extension.
  That is not the same as having none of them, and saying "you have no
  highlights" when the truth is "this extension cannot see your highlights" is
  the failure worth avoiding.

  A read that comes back with a `note` is the same thing said about a whole
  result rather than one type: the items are real but they are not everything.
  Pass that on. Do not describe such a result as complete, and do not conclude
  from it that something does not exist.

evals:
  - input: '@marfa what did I capture today?'
    mocks:
      list-items:
        items:
          - id: itm_1
            type: core.note
            state: active
            properties: { title: 'Standup notes', body: 'Shipped the auth fix' }
            captured: '2026-09-06T09:00:00.000Z'
            tags: ['work']
    expected:
      - callsTool:
          name: list-items

  - input: '@marfa find the note about the auth fix'
    mocks:
      search-items:
        items:
          - id: itm_1
            type: core.note
            state: active
            properties: { title: 'Standup notes' }
            snippet: 'Shipped the auth fix'
    expected:
      - callsTool:
          name: search-items
          arguments:
            # `includes` rather than an exact match. A model asked to find "the
            # note about the auth fix" may search for any of several phrasings,
            # and an eval that pins one is measuring the wording rather than
            # whether the right tool was reached with the right subject.
            query:
              includes: 'auth'

  - input: '@marfa what types can I capture?'
    mocks:
      list-types:
        - type: core.note
          label: Note
          description: 'A written note.'
    expected:
      - callsTool:
          name: list-types

  - input: '@marfa save a note saying the runner pool is fixed'
    mocks:
      list-types:
        type: core.note
        label: Note
        fields:
          - { name: title, kind: string, required: false }
          - { name: body, kind: string, required: false }
      capture-item:
        id: itm_2
        type: core.note
        properties: { body: 'The runner pool is fixed' }
    expected:
      # Only the type is asserted. `properties` is an array of objects, and the
      # documented matcher grammar covers scalars, `includes` and `matches`
      # with dot notation over nested objects; nothing in it describes matching
      # one element of an array. A guess at the syntax passes vacuously if it
      # is wrong, which is worse than asserting less.
      - callsTool:
          name: capture-item
          arguments:
            type: core.note
