<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Raycast and your other apps share one Marfa</title>
  <desc id="d">Raycast, other apps and AI agents each connect to one Marfa server that you run, which holds your notes, tasks, bookmarks and files.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="330" rx="16" fill="#f8f9fb"/>
  <text x="32" y="44" font-size="18" font-weight="600" fill="#111827">Raycast and your other apps share one Marfa</text>

  <rect x="32" y="84" width="220" height="56" rx="10" fill="#fff4ec" stroke="#f26b1d" stroke-width="2"/>
  <text x="142" y="109" font-size="15" font-weight="600" text-anchor="middle" fill="#111827">Raycast</text>
  <text x="142" y="127" font-size="12.5" text-anchor="middle" fill="#4b5563">this extension</text>

  <rect x="32" y="162" width="220" height="56" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
  <text x="142" y="187" font-size="15" font-weight="600" text-anchor="middle" fill="#111827">Your other apps</text>
  <text x="142" y="205" font-size="12.5" text-anchor="middle" fill="#4b5563">notes, tasks, bookmarks</text>

  <rect x="32" y="240" width="220" height="56" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
  <text x="142" y="265" font-size="15" font-weight="600" text-anchor="middle" fill="#111827">AI agents and scripts</text>
  <text x="142" y="283" font-size="12.5" text-anchor="middle" fill="#4b5563">with a key of their own</text>

  <g fill="none" stroke="#6b7280" stroke-width="1.25">
    <path d="M252 112H372" marker-end="url(#arrow)"/>
    <path d="M252 190H372" marker-end="url(#arrow)"/>
    <path d="M252 268H372" marker-end="url(#arrow)"/>
  </g>
  <text x="312" y="102" font-size="12.5" text-anchor="middle" fill="#4b5563">read and write</text>

  <rect x="380" y="84" width="348" height="212" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="554" y="120" font-size="17" font-weight="600" text-anchor="middle" fill="#111827">Your Marfa</text>
  <text x="554" y="140" font-size="12.5" text-anchor="middle" fill="#4b5563">one server, on your Mac or a home server</text>
  <g fill="#ffffff" stroke="#a5b4fc" stroke-width="1.25">
    <rect x="404" y="166" width="140" height="40" rx="8"/>
    <rect x="564" y="166" width="140" height="40" rx="8"/>
    <rect x="404" y="222" width="140" height="40" rx="8"/>
    <rect x="564" y="222" width="140" height="40" rx="8"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#111827">
    <text x="474" y="191">Notes</text>
    <text x="634" y="191">Tasks</text>
    <text x="474" y="247">Bookmarks</text>
    <text x="634" y="247">Files</text>
  </g>
</svg>
